<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15803d" />
    <title>FantaChat non disponibile</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; background: #f4f7f4; color: #0f172a; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #dce7df; border-radius: 16px; background: #fff; box-shadow: 0 12px 30px rgba(15, 23, 42, .08); text-align: center; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #64748b; line-height: 1.5; font-weight: 600; }
      button { margin-top: 20px; border: 0; border-radius: 10px; padding: 11px 16px; background: #15803d; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>FantaChat</h1>
      <p>La connessione non è disponibile. Riprova quando torni online.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
